schema_version: 1

context:
  name: "cltoolbox"
  python_min: "3.10"
  version: "4.0.4"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 38b12636f0ea2fdb4109449515a92e9ec53b8a47f1a248ba545b210944bf6e4c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - docstring_parser
    - docutils

tests:
  - python:
      imports:
        - cltoolbox
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python library for creating and manipulating CLIs
  license: BSD-3-Clause AND MIT
  license_file:
    - LICENSE.txt
    - src/${{ name }}/python_rst2ansi/LICENSE
  homepage: https://pypi.org/project/${{ name }}/

extra:
  recipe-maintainers:
    - timcera
